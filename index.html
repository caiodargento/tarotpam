<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caio D’Argento</title>

<style>

body{
    margin:0;
    padding:0;
    background:#050505;
    color:white;
    font-family:Georgia, serif;
    text-align:center;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top, rgba(255,215,0,0.08), transparent 40%),
    radial-gradient(circle at bottom, rgba(255,255,255,0.03), transparent 30%);
    z-index:-1;
}

.container{
    padding:30px;
}

h1{
    color:#d4af37;
    font-size:42px;
    margin-bottom:10px;
    letter-spacing:2px;
}

.sub{
    color:#999;
    margin-bottom:30px;
}

input{
    width:90%;
    max-width:320px;
    padding:14px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#1b1b1b;
    color:white;
    font-size:16px;
    outline:none;
}

button{
    margin-top:15px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:#d4af37;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#cartas{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
    margin-top:50px;
}

.carta{
    width:260px;
    background:#111;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 25px rgba(212,175,55,0.15);
    animation:fade 1s ease;
    cursor:pointer;
    transition:0.3s;
}

.carta:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 0 35px rgba(212,175,55,0.35);
}

.carta img{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
}

.carta h2{
    color:#d4af37;
    margin-bottom:10px;
}

.carta h3{
    color:#aaa;
    font-size:16px;
    margin-bottom:15px;
}

.carta p{
    color:#ddd;
    line-height:1.5;
    font-size:15px;
}

.footer{
    margin-top:50px;
    color:#666;
    font-size:14px;
}

/* LOADING */

#loading{
    text-align:center;
    margin-top:40px;
}

.shuffle{
    width:120px;
    height:180px;
    margin:auto;
    border-radius:15px;
    border:2px solid #d4af37;
    background:url('img/cards/0603150907669_12_dde7d3947d8cc0b8e10f97cdd2ebdedd.jpg');
    background-size:cover;
    animation:embaralhar 0.4s infinite alternate;
    box-shadow:0 0 30px rgba(212,175,55,0.5);
}

.textoLoading{
    margin-top:20px;
    color:#d4af37;
    font-size:22px;
    letter-spacing:2px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    overflow:auto;
}

.modalConteudo{
    background:#111;
    margin:40px auto;
    padding:30px;
    width:90%;
    max-width:700px;
    border-radius:25px;
    box-shadow:0 0 40px rgba(212,175,55,0.25);
    animation:fade 0.5s ease;
}

.modalConteudo img{
    width:260px;
    max-width:100%;
    border-radius:20px;
    margin-bottom:20px;
}

.modalConteudo h2{
    color:#d4af37;
    font-size:34px;
    margin-bottom:10px;
}

.modalConteudo h3{
    color:#aaa;
    margin-bottom:20px;
}

.modalConteudo p{
    color:#ddd;
    line-height:1.8;
    font-size:18px;
}

.fechar{
    float:right;
    background:#d4af37;
    color:black;
    border:none;
    width:45px;
    height:45px;
    border-radius:50%;
    font-size:26px;
    cursor:pointer;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes embaralhar{

    from{
        transform:
        rotate(-6deg)
        translateX(-10px);
    }

    to{
        transform:
        rotate(6deg)
        translateX(10px);
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Caio D’Argento</h1>

<div class="sub">
Leitura espiritual em 3 cartas
</div>

<input type="text" id="nome" placeholder="Seu nome">

<br>

<input 
type="text" 
id="nascimento" 
placeholder="Data de nascimento (DD/MM/AAAA)"
maxlength="10"
oninput="formatarData(this)">

<br>

<button onclick="fazerLeitura()">
Fazer leitura
</button>

<br>

<button onclick="fazerNumerologia()">
    Numerologia
</button>

<div id="numerologia" style="
margin-top:40px;
display:none;
background:#111;
padding:25px;
border-radius:20px;
max-width:800px;
margin-left:auto;
margin-right:auto;
box-shadow:0 0 25px rgba(212,175,55,0.15);
">
</div>

<div id="cartas"></div>

<div id="loading" style="display:none;">

    <div class="shuffle"></div>

    <div class="textoLoading">
        Embaralhando as cartas...

</div>

<audio id="somCarta" src="freesound_crunchpixstudio-appear-magic-384915.mp3"></audio>

<div class="footer">
Leituras Arcanas • Rider-Waite 1910
</div>

</div>

<!-- MODAL -->

<div id="modalCarta" class="modal">

    <div class="modalConteudo">

        <button class="fechar" onclick="fecharCarta()">
            ×

        <h2 id="modalTitulo"></h2>

        <h3 id="modalResumo"></h3>

        <p id="modalTexto"></p>

    </div>

</div>

<script>

"0603150907669_22_cd146c178e0f7eb196a3d6a43d719d09.jpg"
];

const nomes = [
"O Louco",
"O Mago",
"A Sacerdotisa",
"A Imperatriz",
"O Imperador",
"O Hierofante",
"Os Enamorados",
"O Carro",
"A Força",
"O Eremita",
"A Roda da Fortuna",
"A Justiça",
"O Enforcado",
"A Morte",

];

const significados = [
"Novos começos, liberdade e aventura.",
"Poder pessoal, iniciativa e criação.",
"Intuição, mistério e sabedoria interior.",
"Abundância, feminilidade e criatividade.",
"Autoridade, estrutura e liderança.",
"Espiritualidade, tradição e ensinamentos.",

"Reflexão, solitude e sabedoria.",

"Nova perspectiva, pausa e sacrifício.",

"Tentações, vícios e desejos materiais.",

"Esperança, cura e inspiração.",

const leiturasProfundas = {

"Os Enamorados":
"O dia de hoje revela que escolhas ou pessoas que você já se relacionou tendem a voltar novamente em sua vida. Você pode aceitar ou devolver para o universo. Atenção aos sinais do seu dia.",

"A Morte":
"Sua vida pode estar estagnada nesse dia ou semana, porém a espiritualidade vem te falar que esse ciclo está chegando ao fim. Coisas novas, situações de emprego e contratos serão renovados para melhor.",

"O Julgamento":
"Sua área espiritual está te convocando a ter um relacionamento mais íntimo com o eterno. Abra seu coração para parte espiritual e verá coisas maravilhosas acontecerem."

};

function formatarData(campo){

    let valor = campo.value.replace(/\D/g,'');

    if(valor.length > 2){
        valor = valor.replace(/^(\d{2})(\d)/,'$1/$2');
    }

    if(valor.length > 5){
        valor = valor.replace(/^(\d{2})\/(\d{2})(\d)/,'$1/$2/$3');
    }

    campo.value = valor;
}

function fazerLeitura(){

    const nome = document.getElementById("nome").value;
    const nascimento = document.getElementById("nascimento").value;

    if(nome === "" || nascimento === ""){
        alert("Preencha os campos.");
        return;
    }

    document.getElementById("cartas").innerHTML = "";

    document.getElementById("loading").style.display = "block";

    const audio = document.getElementById("somCarta");

    audio.currentTime = 0;

    audio.play();

    setTimeout(() => {

        document.getElementById("loading").style.display = "none";

        const hoje = new Date();

        const seed =
        nome.length +
        hoje.getDate() +
        hoje.getMonth() +
        hoje.getFullYear() +
        parseInt(nascimento.substring(0,2)) || 1;

        let html = "";

        for(let i=0;i<3;i++){

            const numero = (seed + i * 7) % nomes.length;

            const titulo =
            i === 0 ? "Energia Atual" :
            i === 1 ? "Desafio" :
            "Conselho";

            html += `

            <div class="carta"
            onclick="abrirCarta(
            '${arquivos[numero]}',
            '${nomes[numero]}',
            '${significados[numero]}',
            '${leiturasProfundas[nomes[numero]] || "Grandes energias espirituais cercam essa carta hoje."}'
            )">

                <h3>${titulo}</h3>

                <img src="img/cards/${arquivos[numero]}">

                <h2>${nomes[numero]}</h2>

                <p>${significados[numero]}</p>

            </div>

            `;
        }

        document.getElementById("cartas").innerHTML = html;

    }, 4000);
}

function abrirCarta(imagem, titulo, resumo, texto){

    document.getElementById("modalCarta").style.display = "block";

    document.getElementById("modalImg").src =
    "img/cards/" + imagem;

    document.getElementById("modalTitulo").innerText =
    titulo;

    document.getElementById("modalResumo").innerText =
    resumo;

    document.getElementById("modalTexto").innerText =
    texto;
}

function fecharCarta(){

    document.getElementById("modalCarta").style.display =
    "none";
}

function reduzirNumero(numero){

    while(numero > 9 &&
          numero !== 11 &&
          numero !== 22 &&
          numero !== 33){

        numero = numero
        .toString()
        .split('')
        .reduce((a,b)=>a+parseInt(b),0);
    }

    return numero;
}

function calcularCaminhoVida(data){

    let numeros =
    data.replace(/\D/g,'');

    let soma = 0;

    for(let n of numeros){
        soma += parseInt(n);
    }

    return reduzirNumero(soma);
}

function calcularExpressao(nome){

    const tabela = {
        A:1,J:1,S:1,
        B:2,K:2,T:2,
        C:3,L:3,U:3,
        D:4,M:4,V:4,
        E:5,N:5,W:5,
        F:6,O:6,X:6,
        G:7,P:7,Y:7,
        H:8,Q:8,Z:8,
        I:9,R:9
    };

    let soma = 0;

    nome = nome.toUpperCase();

    for(let letra of nome){

        if(tabela[letra]){
            soma += tabela[letra];
        }
    }

    return reduzirNumero(soma);
}

function calcularAlma(nome){

    const valores = {
        A:1,E:5,I:9,O:6,U:3
    };

    let soma = 0;

    nome = nome.toUpperCase();

    for(let letra of nome){

        if(valores[letra]){
            soma += valores[letra];
        }
    }

    return reduzirNumero(soma);
}

function interpretarNumero(numero){

    const textos = {

        1:"Liderança, independência e iniciativa.",

        2:"Cooperação, diplomacia e sensibilidade.",

        3:"Comunicação, criatividade e expressão.",

        4:"Trabalho, disciplina e construção.",

        5:"Mudanças, liberdade e movimento.",

        6:"Responsabilidade, família e harmonia.",

        7:"Espiritualidade, estudo e introspecção.",

        8:"Poder material, gestão e prosperidade.",

        9:"Sabedoria, compaixão e encerramentos.",

        11:"Número mestre da intuição e inspiração.",

        22:"Número mestre da construção e realização.",

        33:"Número mestre do serviço e amor universal."
    };

    return textos[numero] ||
    "Energia especial em desenvolvimento.";
}

function fazerNumerologia(){

    const nome =
    document.getElementById("nome").value;

    const nascimento =
    document.getElementById("nascimento").value;

    if(nome === "" || nascimento === ""){

        alert("Preencha nome e data.");
        return;
    }

    const caminho =
    calcularCaminhoVida(nascimento);

    const expressao =
    calcularExpressao(nome);

    const alma =
    calcularAlma(nome);

    document.getElementById("numerologia").style.display =
    "block";

    document.getElementById("numerologia").innerHTML = `

        <h2 style="color:#d4af37;">
            Numerologia Pessoal
        </h2>

        <h3>
            Caminho de Vida: ${caminho}
        </h3>

        <p>
            ${interpretarNumero(caminho)}
        </p>

        <hr>

        <h3>
            Número da Expressão: ${expressao}
        </h3>

        <p>
            ${interpretarNumero(expressao)}
        </p>

        <hr>

        <h3>
            Número da Alma: ${alma}
        </h3>

        <p>
            ${interpretarNumero(alma)}
        </p>

        <hr>

        <p style="
        color:#d4af37;
        font-size:18px;
        line-height:1.7;
        ">
        Sua leitura numerológica mostra tendências ligadas ao seu nome e à sua data de nascimento. A interpretação busca destacar potenciais, desafios e características que podem estar mais evidentes neste momento da sua jornada.
        </p>

    `;
}

</script>
